  #hint{position:fixed;bottom:5vmin;left:0;right:0;text-align:center;font-size:min(3.4vmin,20px);opacity:.9;pointer-events:none;text-shadow:0 .3vmin 0 #000a;display:none}

<script src="three.min.js"></script>
<script>
/* =====================================================================
   ANUNCIOS — CONECTA AQUÍ TU RED PUBLICITARIA
   showRewardedAd(onReward): llama onReward() SOLO si el usuario terminó de ver el anuncio.
   Ahora es un anuncio SIMULADO de 5 s para probar. Reemplaza el cuerpo por el SDK real
   (Google AdSense for Games / AdinPlay / Poki / CrazyGames, etc.).
   ===================================================================== */
const AD_SECONDS = 5;
function simulatedAd(onReward){
  const s=document.getElementById('ad'),fill=document.getElementById('adfill'),
        txt=document.getElementById('adTxt'),btn=document.getElementById('adClose');
  s.classList.add('on'); btn.style.display='none'; fill.style.width='0';
  let t=0;
  const iv=setInterval(()=>{
    t+=.1; fill.style.width=Math.min(100,t/AD_SECONDS*100)+'%';
    txt.textContent=t<AD_SECONDS?'Tu recompensa llega en '+Math.ceil(AD_SECONDS-t)+'…':'¡Listo! Ya ganaste tu recompensa.';
    if(t>=AD_SECONDS){clearInterval(iv);btn.style.display='inline-block';
      btn.onclick=()=>{s.classList.remove('on');onReward();};}
  },100);
}

let adBusy=false;
function showRewardedAd(onReward){
  if(window.GamePix&&GamePix.rewardAd){
    if(adBusy)return; adBusy=true;
    const fail=()=>{adBusy=false;if(window.__setMusic)__setMusic(true);if(window.__toast)window.__toast('No hay anuncio disponible ahora. Intenta de nuevo en un momento.');};
    if(window.__setMusic)__setMusic(false);try{GamePix.rewardAd().then(res=>{adBusy=false;if(window.__setMusic)__setMusic(true);if(res&&res.success)onReward();else fail();}).catch(fail);}catch(e){fail();}
  } else simulatedAd(onReward);
}
function showInterstitial(cb){
  if(window.GamePix&&GamePix.interstitialAd&&!adBusy){
    adBusy=true;if(window.__setMusic)__setMusic(false);const done=()=>{adBusy=false;if(window.__setMusic)__setMusic(true);cb&&cb();};
    try{GamePix.interstitialAd().then(done).catch(done);}catch(e){done();}
  } else cb&&cb();
}

(()=>{
'use strict';
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------- guardado ---------- */
const KEY='saltasalta3d_v1', REGEN=4*60*1000;
const store={get(k){try{return (window.GamePix&&GamePix.localStorage)?GamePix.localStorage.getItem(k):localStorage.getItem(k);}catch(e){return null;}},
  set(k,v){try{if(window.GamePix&&GamePix.localStorage)GamePix.localStorage.setItem(k,v);else localStorage.setItem(k,v);}catch(e){}}};
function gp(n,a){try{if(window.GamePix&&GamePix[n])GamePix[n](a);}catch(e){}}
let S={};
try{S=JSON.parse(store.get(KEY))||{};}catch(e){}
S=Object.assign({coins:0,best:0,hearts:3,heartTs:Date.now(),runs:0,char:'m',chestTs:0},S);
S.owned=Array.isArray(S.owned)?S.owned:['m0','f0'];S.outfit=Object.assign({m:0,f:0},S.outfit||{});
S.up=Object.assign({magnet:0,mult:0,hearts:0},S.up||{});
S.mis=S.mis&&S.mis.length===3?S.mis:[{t:'coins',k:0},{t:'dist',k:0},{t:'runs',k:0,c:0}];
function save(){store.set(KEY,JSON.stringify(S));}
const maxH=()=>3+S.up.hearts;
function tickHearts(){
  const mx=maxH(),now=Date.now();
  if(S.hearts>=mx){S.heartTs=now;return;}
  while(S.hearts<mx&&now-S.heartTs>=REGEN){S.hearts++;S.heartTs+=REGEN;}
  if(S.hearts>=mx)S.heartTs=now;
}

/* ---------- audio ---------- */
let ac,muted=false;
function beep(f,d=.08,type='square',v=.04,slide=0){
  if(muted)return;
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(f+slide,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);}catch(e){}
}
/* ---------- música original (generada, sin archivos) ---------- */
const mus={on:false,step:0,next:0,gain:null,noise:null,vol:.55};
const CH_ROOT=[110,87.31,130.81,98];
const CH_TONES=[[220,261.63,329.63,440],[174.61,220,261.63,349.23],[261.63,329.63,392,523.25],[196,246.94,293.66,392]];
const ARP=[0,1,2,3,2,1,2,3,0,1,2,3,2,1,3,2];
function mOsc(f,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(mus.gain);o.start(t);o.stop(t+d+.02);}
function mKick(t){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);
  g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g);g.connect(mus.gain);o.start(t);o.stop(t+.18);}
function mHat(t,v){const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=mus.noise;f.type='highpass';f.frequency.value=7500;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);s.connect(f);f.connect(g);g.connect(mus.gain);s.start(t);s.stop(t+.06);}
function mStep(s,t){
  const bar=(s>>4)&3,k=s&15,play=state==='play',tones=CH_TONES[bar],root=CH_ROOT[bar];
  if(k%4===0&&(play||k%8===0))mKick(t);
  if(play&&k%4===2)mHat(t,.06);
  if(k%4===0)mOsc(root,t,.22,'triangle',.2);else if(k%4===2)mOsc(root*2,t,.14,'triangle',.11);
  mOsc(tones[ARP[k]],t,play?.12:.18,play?'square':'triangle',play?.045:.05);
  if(play&&(k===0||k===8))mOsc(tones[2]*2,t,.35,'sine',.07);
}
function musicTick(){
  if(!ac||ac.state!=='running')return;
  while(mus.next<ac.currentTime+.15){
    mStep(mus.step,mus.next);
    const bpm=state==='play'&&run?118+Math.min(34,(run.speed-16)*1.1):104;
    mus.next+=60/bpm/4;mus.step=(mus.step+1)%64;
  }
}
function startMusic(){
  if(mus.on)return;
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    mus.gain=ac.createGain();mus.gain.gain.value=muted?0:mus.vol;mus.gain.connect(ac.destination);
    const nb=ac.createBuffer(1,Math.floor(ac.sampleRate*.1),ac.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;mus.noise=nb;
    mus.next=ac.currentTime+.1;mus.on=true;setInterval(musicTick,30);
  }catch(e){}
}
window.__setMusic=on=>{if(mus.gain)mus.gain.gain.value=(on&&!muted)?mus.vol:0;};
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,startMusic,{once:true,passive:true}));
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';if(mus.gain)mus.gain.gain.value=muted?0:mus.vol;};

/* ---------- three.js ---------- */
const LANES=[-2.4,0,2.4],TILE=30,NT=5;
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new THREE.Scene();
const HZ=new THREE.Color(0xd6eaf8);
scene.background=HZ.clone();
scene.fog=new THREE.Fog(0xd6eaf8,30,125);
const camera=new THREE.PerspectiveCamera(62,1,.1,300);
camera.position.set(0,4.6,8);
function resize(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.fov=w/h<.8?78:62;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();
scene.add(new THREE.HemisphereLight(0xdfefff,0x8a8f9c,1.0));
const sun=new THREE.DirectionalLight(0xfff0d0,1.25);sun.position.set(-10,16,7);scene.add(sun);

const M=c=>new THREE.MeshLambertMaterial({color:c});
const mat={road:M(0x3d4257),line:M(0xf2f2f2),walk:M(0xaab3c7),grass:M(0x7ed957),
  skin:M(0xffdcb0),shirt:M(0xff7a1a),pants:M(0x2f6fe0),cap:M(0xe83a5f),white:M(0xffffff),
  gold:new THREE.MeshLambertMaterial({color:0xffd93b,emissive:0x8a6500}),
  red:M(0xe23b3b),stripe:M(0xffffff),train:M(0x2f7fe0),trainTop:M(0x1d4fa0),glass:M(0xbfe6ff),post:M(0x555b6e),
  mag:new THREE.MeshLambertMaterial({color:0xff3b3b,emissive:0x661010}),
  x2:new THREE.MeshLambertMaterial({color:0xb04bff,emissive:0x3d1170}),
  shd:new THREE.MeshLambertMaterial({color:0x3fd0ff,emissive:0x0d5670})};
const bldColors=[0xff9aa2,0xffdac1,0xb5ead7,0xc7ceea,0xffe29a,0x9ad7ff,0xf7b7ff].map(M);
const unitBox=new THREE.BoxGeometry(1,1,1);unitBox.translate(0,.5,0);

// ---- cielo realista: degradado, sol y nubes ----
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{top:{value:new THREE.Color(0x2f78d2)},mid:{value:new THREE.Color(0x86bff0)},hz:{value:HZ}},
  vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'varying vec3 vP;uniform vec3 top,mid,hz;void main(){float h=clamp(vP.y,0.,1.);vec3 c=mix(hz,mid,smoothstep(0.,.22,h));c=mix(c,top,smoothstep(.18,.85,h));gl_FragColor=vec4(c,1.);\n#include <colorspace_fragment>\n}'});
const sky=new THREE.Mesh(new THREE.SphereGeometry(250,24,16),skyMat);sky.renderOrder=-10;scene.add(sky);
function radial(size,stops){const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d'),g=x.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);stops.forEach(s=>g.addColorStop(s[0],s[1]));x.fillStyle=g;x.fillRect(0,0,size,size);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;}
const sunS=new THREE.Sprite(new THREE.SpriteMaterial({map:radial(256,[[0,'rgba(255,255,245,1)'],[.1,'rgba(255,250,220,1)'],[.28,'rgba(255,235,170,.5)'],[1,'rgba(255,225,160,0)']]),fog:false,depthWrite:false,transparent:true}));
sunS.scale.set(110,110,1);sunS.position.set(-70,62,-200);sunS.renderOrder=-9;scene.add(sunS);
function cloudTex(){const c=document.createElement('canvas');c.width=256;c.height=128;const x=c.getContext('2d');
  for(let i=0;i<16;i++){const cx=40+Math.random()*176,cy=52+Math.random()*36,r=20+Math.random()*26,g=x.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,'rgba(255,255,255,.6)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;}
const cloudTexs=[0,1,2,3,4].map(cloudTex),clouds=[];
for(let i=0;i<16;i++){
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:cloudTexs[i%5],fog:false,depthWrite:false,transparent:true,opacity:.95}));
  const w=rnd(70,130);s.scale.set(w,w*.45,1);s.position.set(rnd(-200,200),rnd(38,95),rnd(-215,-150));s.renderOrder=-8;scene.add(s);clouds.push(s);
}

// ---- ciudad ----
const noiseTex=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle='#3b4050';x.fillRect(0,0,256,256);
  for(let i=0;i<4500;i++){const v=40+Math.random()*50|0;x.fillStyle='rgba('+v+','+v+','+(v+8)+',.55)';x.fillRect(Math.random()*256,Math.random()*256,2,2);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,7);t.colorSpace=THREE.SRGBColorSpace;return t;})();
mat.road=new THREE.MeshLambertMaterial({map:noiseTex});
mat.curb=M(0xcfd3da);mat.conc=M(0x9aa2b0);mat.walk=M(0xb4bccb);mat.yel=M(0xf5c518);
mat.pole=M(0x4a5060);mat.lamp=new THREE.MeshLambertMaterial({color:0xfff4c2,emissive:0xffe9a0});
mat.trunk=M(0x6b4a2b);mat.leaf1=M(0x3f9e4a);mat.leaf2=M(0x58b85a);mat.hedge=M(0x2f8a3e);
function facade(base,lit){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  x.fillStyle=base;x.fillRect(0,0,128,128);
  for(let r=0;r<4;r++)for(let k=0;k<4;k++){const on=Math.random()<lit;

/* ---------- lógica ---------- */
function update(dt){
  run.t+=dt;run.speed=Math.min(46,16+run.t*.5);
  const dz=run.speed*dt;run.dist+=dz;
  const lv=1+((run.dist/500)|0);if(lv!==run.lv){run.lv=lv;gp('updateLevel',lv);if(lv>1)toast('⭐ ¡Nivel '+lv+'!');}
  if(P.inv>0)P.inv-=dt;if(T.magnet>0)T.magnet-=dt;if(T.mult>0)T.mult-=dt;if(comboT>0)comboT-=dt;else combo=0;
  // jugador
  P.x+=(LANES[P.lane]-P.x)*Math.min(1,dt*15);
  P.vy-=40*dt;P.y+=P.vy*dt;if(P.y<0){P.y=0;P.vy=0;}
  if(P.slide>0)P.slide-=dt;
  const sliding=P.slide>0&&P.y<=.05;
  // mundo
  tiles.forEach(t=>{t.position.z+=dz;if(t.position.z>25){t.position.z-=TILE*NT;shuffleBlds(t);}});
  obs.forEach(o=>{o.z+=dz;o.m.position.z=o.z;});
  coinsArr.forEach(c=>{c.m.position.z+=dz;c.m.rotation.y+=dt*5;});
  pows.forEach(p=>{p.z+=dz;p.m.position.z=p.z;p.m.rotation.y+=dt*3;p.m.position.y=1.3+Math.sin(run.t*4)*.15;});
  run.nextRow-=dz;if(run.nextRow<=0){spawnRow();run.nextRow=16+rnd(0,7)+run.speed*.38;if(Math.random()<Math.min(.3,run.dist/6000))run.nextRow*=.65;}
  // colisiones
  const pTop=P.y+(sliding?.8:1.8),pcy=P.y+(sliding?.4:.9);
  for(let i=obs.length-1;i>=0;i--){
    const o=obs[i];
    if(o.z>16){scene.remove(o.m);obs.splice(i,1);continue;}
    if(P.inv>0)continue;
    if(Math.abs(o.z)<o.d/2+.35&&Math.abs(P.x-o.x)<1.2){
      let hit=false;
      if(o.type==='bar')hit=P.y<1.0;
      else if(o.type==='low')hit=pTop>1.3&&P.y<2.2;
      else hit=P.y<3.2;
      if(hit){
        if(run.shield){run.shield=false;bubble.visible=false;P.inv=1.6;scene.remove(o.m);obs.splice(i,1);shake=.3;beep(160,.25,'sawtooth',.06,-80);toast('🛡️ ¡El escudo te salvó!');}
        else{die();return;}
      }
    }
  }
  const mg=T.magnet>0;
  for(let i=coinsArr.length-1;i>=0;i--){
    const c=coinsArr[i],m=c.m;
    if(m.position.z>16){scene.remove(m);coinsArr.splice(i,1);continue;}
    if(mg&&m.position.z>-26&&m.position.z<4){
      const k=Math.min(1,dt*9);m.position.x+=(P.x-m.position.x)*k;m.position.y+=(pcy-m.position.y)*k;m.position.z+=(0-m.position.z)*k*.6;
    }
    const dx=m.position.x-P.x,dy=m.position.y-pcy,dzc=m.position.z;
    if(Math.abs(dzc)<.9&&Math.abs(dx)<.9&&Math.abs(dy)<1.1){
      scene.remove(m);coinsArr.splice(i,1);
      const v=T.mult>0?2:1;run.coins+=v;S.coins+=v;
      combo=Math.min(combo+1,14);comboT=.5;beep(720+combo*40,.07,'square',.035);
    }
  }
  for(let i=pows.length-1;i>=0;i--){
    const p=pows[i];
    if(p.z>16){scene.remove(p.m);pows.splice(i,1);continue;}
    if(Math.abs(p.z)<1&&Math.abs(p.x-P.x)<1.2&&P.y<2.5){
      scene.remove(p.m);pows.splice(i,1);const mx=maxes();
      if(p.type==='mag'){T.magnet=mx.mag;toast('🧲 ¡Imán!');}
      else if(p.type==='x2'){T.mult=mx.mul;toast('✖️2 ¡Monedas dobles!');}
      else{run.shield=true;bubble.visible=true;toast('🛡️ ¡Escudo!');}
      beep(900,.2,'triangle',.06,500);
    }
  }
  hud();
}
function die(){
  state='dying';shake=.6;beep(120,.5,'sawtooth',.08,-90);
  setTimeout(()=>{
    if(state!=='dying')return;state='dead';
    $('dDist').textContent='🏃 '+(run.dist|0)+' m';$('dCoins').textContent='🪙 +'+run.coins;
    $('bReviveAd').style.display=run.revAdN>=2?'none':'';
    const bd=$('bDouble');bd.style.display=(run.coins>0&&!run.doubled)?'':'none';bd.innerHTML='📺 Ver anuncio: ¡duplicar monedas! <span class="sub">+'+run.coins+' 🪙 extra</span>';
    const cost=reviveCost();const b=$('bReviveCoin');
    b.innerHTML='🪙 Seguir por '+cost+' monedas<span class="sub">tienes '+S.coins+'</span>';b.disabled=S.coins<cost;
    $('dead').classList.add('on');$('hud').classList.remove('on');
  },650);
}
const reviveCost=()=>60*(run.revN+1);
function revive(){
  obs=obs.filter(o=>{if(o.z>-50){scene.remove(o.m);return false;}return true;});
  P.inv=3;P.y=0;P.vy=0;P.slide=0;state='play';
  $('dead').classList.remove('on');$('hud').classList.add('on');beep(600,.3,'triangle',.06,500);
}
$('bReviveAd').onclick=()=>showRewardedAd(()=>{run.revAdN++;revive();});
$('bDouble').onclick=()=>showRewardedAd(()=>{if(run.doubled)return;run.doubled=true;S.coins+=run.coins;save();$('bDouble').style.display='none';toast('🪙 ¡Monedas duplicadas! +'+run.coins);});
$('bReviveCoin').onclick=()=>{const c=reviveCost();if(S.coins<c)return;S.coins-=c;run.revN++;save();revive();};
$('bEnd').onclick=endRun;

/* ---------- fin de partida y misiones ---------- */
const misDef={
  coins:{txt:k=>`Junta ${40*(k+1)} monedas en una partida`,tgt:k=>40*(k+1),rew:k=>30*(k+1)},
  dist:{txt:k=>`Corre ${400*(k+1)} m en una partida`,tgt:k=>400*(k+1),rew:k=>40*(k+1)},
  runs:{txt:k=>`Juega ${3*(k+1)} partidas`,tgt:k=>3*(k+1),rew:k=>50*(k+1)}
};
function endRun(){
  state='menu';const d=run.dist|0;
  if(d>S.best){S.best=d;gp('happyMoment');}S.runs++;gp('updateScore',d);
  let msgs=[];
  S.mis.forEach(m=>{
    const def=misDef[m.t],tg=def.tgt(m.k);let done=false;
    if(m.t==='coins')done=run.coins>=tg;else if(m.t==='dist')done=d>=tg;else{m.c=(m.c||0)+1;done=m.c>=tg;}
    if(done){const r=def.rew(m.k);S.coins+=r;m.k++;if(m.t==='runs')m.c=0;msgs.push('🎯 ¡Misión cumplida! +'+r+' 🪙');gp('happyMoment');}
  });
  save();clearWorld();run=null;
  $('dead').classList.remove('on');$('hud').classList.remove('on');$('menu').classList.add('on');
  renderMenu();if(msgs.length)toast(msgs.join('  '));
  showInterstitial(()=>{if(S.hearts<=0)setTimeout(openNoLife,300);});
}

/* ---------- menú / tienda ---------- */
function renderMenu(){
  tickHearts();
  const mx=maxH();
  $('mCoins').textContent='🪙 '+S.coins;$('mBest').textContent='🏆 '+S.best+' m';
  $('mHearts').textContent='❤️'.repeat(S.hearts)+'🖤'.repeat(Math.max(0,mx-S.hearts));
  if(S.hearts<mx){const left=Math.max(0,REGEN-(Date.now()-S.heartTs)),m=Math.floor(left/60000),s=Math.floor(left/1000)%60;
    $('mTimer').textContent='Próxima vida en '+m+':'+String(s).padStart(2,'0');}else $('mTimer').textContent='¡Vidas al máximo!';
  const none=S.hearts<=0;
  $('bPlay').disabled=false;$('bBonus').disabled=none;$('bLife').style.display=S.hearts<mx?'':'none';
  {const left=180000-(Date.now()-(S.chestTs||0));const bc=$('bChest');
   if(left>0){bc.disabled=true;bc.innerHTML='🎁 Próximo cofre en '+Math.floor(left/60000)+':'+String(Math.floor(left/1000)%60).padStart(2,'0');}
   else{bc.disabled=false;bc.innerHTML='📺 Ver anuncio: Cofre de monedas 🎁<span class="sub">+100 🪙</span>';}}
  $('cM').classList.toggle('sel',S.char!=='f');$('cF').classList.toggle('sel',S.char==='f');
  $('bPlay').firstChild.textContent=none?'😴 SIN VIDAS ':'▶ JUGAR ';
}
setInterval(()=>{if(state==='menu'&&$('menu').classList.contains('on'))renderMenu();},1000);
function openNoLife(){renderMenu();const left=Math.max(0,REGEN-(Date.now()-S.heartTs));$('nlTimer').textContent='Próxima vida gratis en '+Math.floor(left/60000)+':'+String(Math.floor(left/1000)%60).padStart(2,'0');$('nolife').classList.add('on');}
$('bPlay').onclick=()=>{if(S.hearts>0)beginRun(false);else openNoLife();};
$('bNo1').onclick=()=>showRewardedAd(()=>{$('nolife').classList.remove('on');S.hearts=Math.max(S.hearts,0)+1;save();beginRun(true);});
$('bNo2').onclick=()=>{toast('Anuncio 1 de 2');showRewardedAd(()=>{toast('Anuncio 2 de 2');showRewardedAd(()=>{S.hearts=maxH();save();$('nolife').classList.remove('on');renderMenu();toast('❤️ ¡Vidas al máximo!');});});};
$('bNoWait').onclick=()=>$('nolife').classList.remove('on');
$('bBonus').onclick=()=>{if(S.hearts>0)showRewardedAd(()=>beginRun(true));};
$('bChest').onclick=()=>showRewardedAd(()=>{S.coins+=100;S.chestTs=Date.now();save();renderMenu();toast('🎁 ¡Cofre! +100 🪙');});
$('bLife').onclick=()=>showRewardedAd(()=>{if(S.hearts<maxH())S.hearts++;save();renderMenu();toast('❤️ +1 vida');});
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{['shop','missions'].forEach(i=>$(i).classList.remove('on'));$('menu').classList.add('on');renderMenu();});
$('cM').onclick=()=>{S.char='m';buildChar('m');save();renderMenu();};
$('cF').onclick=()=>{S.char='f';buildChar('f');save();renderMenu();};
$('bShop').onclick=()=>{$('menu').classList.remove('on');$('shop').classList.add('on');renderShop();};
$('bMis').onclick=()=>{$('menu').classList.remove('on');$('missions').classList.add('on');renderMis();};

const shopDef=[
  {k:'magnet',name:'🧲 Imán más largo',desc:l=>`Dura ${8+2*l}s → ${10+2*l}s`,max:5,cost:l=>100*(l+1)},
  {k:'mult',name:'✖️2 Monedas dobles más largas',desc:l=>`Dura ${10+2*l}s → ${12+2*l}s`,max:5,cost:l=>150*(l+1)},
  {k:'hearts',name:'❤️ Más vidas máximas',desc:l=>`${3+l} → ${4+l} vidas`,max:3,cost:l=>300*(l+1)}
];
function renderShop(){
  $('sCoins').textContent='🪙 '+S.coins;
  const L=$('shopList');L.innerHTML='';
  shopDef.forEach(d=>{
    const lvl=S.up[d.k],maxed=lvl>=d.max,cost=d.cost(lvl);
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<div><h3>${d.name}</h3><p>${maxed?'¡Nivel máximo!':d.desc(lvl)}</p><p>Nivel ${lvl}/${d.max}</p></div>`;
    const b=document.createElement('button');b.className='coin';b.textContent=maxed?'✔':'🪙 '+cost;b.disabled=maxed||S.coins<cost;
    b.onclick=()=>{S.coins-=cost;S.up[d.k]++;if(d.k==='hearts')S.hearts++;save();renderShop();beep(800,.15,'triangle',.06,400);};
    c.appendChild(b);L.appendChild(c);
  });
  const kind=S.char==='f'?'f':'m';
  const t=document.createElement('h3');t.textContent='👔 Ropa — '+(kind==='f'?'Mujer':'Hombre');t.style.marginTop='1vmin';L.appendChild(t);
  OUTFITS[kind].forEach((o,idx)=>{
    const key=kind+idx,owned=S.owned.includes(key),eq=S.outfit[kind]===idx;
    const c=document.createElement('div');c.className='card';
    c.innerHTML='<div style="display:flex;gap:2vmin;align-items:center"><span style="width:5vmin;height:5vmin;border-radius:50%;background:#'+o.c.toString(16).padStart(6,'0')+';border:.5vmin solid #fff;display:inline-block"></span><h3>'+o.n+'</h3></div>';
    const b=document.createElement('button');b.className=owned?'blue':'coin';
    b.textContent=eq?'✔ Puesto':owned?'Ponerme':'🪙 '+o.p;b.disabled=eq||(!owned&&S.coins<o.p);
    b.onclick=()=>{if(!owned){S.coins-=o.p;S.owned.push(key);}S.outfit[kind]=idx;buildChar(kind);save();renderShop();beep(800,.15,'triangle',.06,400);};
    c.appendChild(b);L.appendChild(c);
  });
}
function renderMis(){
  const L=$('misList');L.innerHTML='';
  S.mis.forEach(m=>{
    const def=misDef[m.t],tg=def.tgt(m.k),c=document.createElement('div');c.className='card';
    let pr=m.t==='runs'?(m.c||0)/tg:0;
    c.innerHTML=`<div><h3>${def.txt(m.k)}</h3><p>Premio: 🪙 ${def.rew(m.k)} · nivel ${m.k+1}</p><div class="bar"><i style="width:${Math.min(100,pr*100)}%"></i></div></div><div style="font-size:5vmin">${m.t==='runs'?(m.c||0)+'/'+tg:'🎯'}</div>`;
    L.appendChild(c);
  });
}

/* ---------- bucle ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(state==='play')update(dt);
  else if(state==='menu'||state==='dead'||state==='dying'){
    menuT+=dt;
    if(state==='menu'){tiles.forEach(t=>{t.position.z+=6*dt;if(t.position.z>25){t.position.z-=TILE*NT;shuffleBlds(t);}});}
  }
  // animación del jugador
  const t=now/1000,running=state==='play'||state==='menu',sl=state==='play'&&P.slide>0&&P.y<=.05;
  const sp=state==='play'?run.speed/15:.6;
  animChar(t,running,sp,sl);
  pl.position.set(P.x,P.y,0);
  pl.rotation.z=state==='play'?(LANES[P.lane]-P.x)*-.08:0;
  pl.visible=!(P.inv>0&&((t*14)|0)%2===0)&&state!=='dead';
  if(state==='dying'||state==='dead'){pl.rotation.x=-.4;}else pl.rotation.x=0;
  blob.position.x=P.x;blob.scale.setScalar(Math.max(.4,1-P.y*.18));
  bubble.rotation.y+=dt;
  clouds.forEach(c=>{c.position.x+=dt*1.2;if(c.position.x>230)c.position.x=-230;});
  // cámara
  if(shake>0)shake-=dt;
  const sh=shake>0?shake:0;
  camera.position.x+=((P.x*.55)-camera.position.x)*Math.min(1,dt*6);
  camera.position.y=4.6+(Math.random()-.5)*sh*.6;
  camera.lookAt(P.x*.3,1.6,-6);
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
tickHearts();renderMenu();
requestAnimationFrame(loop);
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(state==='play'){state='paused';$('pause').classList.add('on');}try{ac&&ac.suspend();}catch(e){}}
  else{try{ac&&ac.resume();}catch(e){}}
});
$('pause').onclick=()=>{if(state==='paused'){state='play';$('pause').classList.remove('on');last=performance.now();}};
window.__toast=toast;
gp('loaded');
window.__dbg={get music(){return mus.on;},S,get state(){return state;},get run(){return run;},beginRun,P,die};
})();
</script>
